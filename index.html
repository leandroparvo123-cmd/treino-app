<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caderno de Treino</title>
<meta name="theme-color" content="#0B0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }

/* Layout: coluna única estilo ficha de academia; treinos marcados com as cores de anilhas olímpicas; boneco anatômico em cada exercício */
:root {
  --cardio: #1AA7CC;
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --ink: #17202A;
  --muted: #5B6875;
  --line: #D6DCE3;
  --accent: #1F5FAE;
  --accent-ink: #FFFFFF;
  --good: #2E7D4F;
  --good-bg: #E3F2E8;
  --warn: #8A6200;
  --warn-bg: #FFF4D1;
  --danger: #B8322A;
  --danger-bg: #FBE5E3;
  --p1: #2F6FB5; --p2: #D9A400; --p3: #3C8C5A; --p4: #C8372D; --p5: #4A5560;
  --fig: #B9C3CE; --fig-far: #8E9AA7; --muscle: #D8483B; --muscle-far: #E58A80; --prop: #56616D; --floor: #D3DAE1; --stage: #F6F8FA;
  --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161C; --surface: #1A2129; --surface-2: #212A33; --ink: #E7ECF1; --muted: #93A0AD;
    --line: #2D3742; --accent: #6FA3E6; --accent-ink: #0D1720; --good: #6CC493; --good-bg: #183324;
    --warn: #E8C55A; --warn-bg: #3A3216; --danger: #F07A70; --danger-bg: #3B1E1C;
    --p1: #5B95D6; --p2: #E8BC2E; --p3: #5DB07D; --p4: #E0625A; --p5: #8B97A3;
    --fig: #7C8896; --fig-far: #56626F; --muscle: #F0675A; --muscle-far: #A8504A; --prop: #A7B2BE; --floor: #36414D; --stage: #151B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161C; --surface: #1A2129; --surface-2: #212A33; --ink: #E7ECF1; --muted: #93A0AD;
  --line: #2D3742; --accent: #6FA3E6; --accent-ink: #0D1720; --good: #6CC493; --good-bg: #183324;
  --warn: #E8C55A; --warn-bg: #3A3216; --danger: #F07A70; --danger-bg: #3B1E1C;
  --p1: #5B95D6; --p2: #E8BC2E; --p3: #5DB07D; --p4: #E0625A; --p5: #8B97A3;
  --fig: #7C8896; --fig-far: #56626F; --muscle: #F0675A; --muscle-far: #A8504A; --prop: #A7B2BE; --floor: #36414D; --stage: #151B22;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body.lock { overflow: hidden; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 18px;
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 34px; font-weight: 700; line-height: 1; text-transform: uppercase; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 18px; font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.banner { background: var(--warn-bg); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }

.people { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.add { color: var(--accent); border-style: dashed; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; gap: 4px; }
.tabs.two { grid-template-columns: repeat(2, 1fr); }
.tab { border: 0; background: none; border-radius: 9px; padding: 9px 4px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* ficha */
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.ficha .obj { font-weight: 700; min-width: 0; }
.ficha .dates { grid-column: 1 / -1; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ficha .obs { grid-column: 1 / -1; font-size: 14px; }
.state { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.state.ok { background: var(--good-bg); color: var(--good); }
.state.warn { background: var(--warn-bg); color: var(--warn); }
.state.bad { background: var(--danger-bg); color: var(--danger); }

/* anilhas */
.plates { display: flex; gap: 10px; flex-wrap: wrap; }
.plate { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; width: 64px; }
.plate .disc {
  width: 52px; height: 52px; border-radius: 50%; background: var(--pc); display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 22px; color: #fff;
  box-shadow: inset 0 0 0 5px rgba(0,0,0,.14), inset 0 0 0 19px var(--pc), inset 0 0 0 21px rgba(0,0,0,.22);
  opacity: .45; transition: opacity .15s, transform .15s;
}
.plate[aria-pressed="true"] .disc { opacity: 1; transform: scale(1.06); }
.plate .pn { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.2; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate[aria-pressed="true"] .pn { color: var(--ink); }
.next-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }

/* exercício */
.list { display: flex; flex-direction: column; gap: 10px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; }
.thumb { border: 1px solid var(--line); background: var(--stage); border-radius: 10px; padding: 0; width: 104px; height: 78px; display: block; position: relative; overflow: hidden; }
.thumb canvas { width: 100%; height: 100%; display: block; }
.thumb .play { position: absolute; right: 5px; bottom: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); opacity: .75; }
.thumb .play::after { content: ""; position: absolute; left: 8px; top: 6px; border-left: 7px solid var(--bg); border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.ex .info { min-width: 0; }
.ex .name { font-weight: 700; font-size: 16px; line-height: 1.25; }
.ex .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ex .last { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--good-bg); color: var(--good); }
.inputs { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field input, .field select, .field textarea, .txt {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px;
  padding: 9px 10px; font-size: 16px; font-variant-numeric: tabular-nums;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .txt:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; }
.rest-btn { align-self: end; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 12px; font-weight: 600; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.howbtn { grid-column: 1 / -1; justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0; }
.sets { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
.set { flex: 1 1 0; min-width: 90px; min-height: 64px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.set small { font-size: 12px; font-weight: 600; color: var(--muted); }
.set[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.set[aria-pressed="true"] small { color: #fff; }

.btn { border: 0; border-radius: var(--r); padding: 13px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); font-size: 15px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.go { background: var(--good); color: #fff; }
.btn.link { background: none; color: var(--accent); padding: 8px 0; text-align: left; }
.btn.danger { background: none; color: var(--danger); padding: 8px 0; }
.btn.danger.armed { background: var(--danger); color: #fff; padding: 8px 12px; }
.btn.sm { padding: 9px 12px; font-size: 14px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.care { background: var(--warn-bg); border-radius: 9px; padding: 8px 10px; font-size: 14px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* editor */
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.thead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.dot { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--pc); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; }
.thead .txt { font-weight: 700; }
.erow { display: grid; grid-template-columns: 64px 1fr 60px 80px 92px 32px; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: end; }
.erow .thumb { width: 64px; height: 48px; align-self: center; }
.erow .field input, .erow .field select { font-size: 15px; padding: 8px; }
.x { border: 0; background: none; color: var(--muted); font-size: 22px; height: 38px; }
.extra { grid-column: 1 / -1; }
.extra summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; }
.extra .field { margin-top: 6px; }
.tfoot { padding: 8px 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 14px; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
@media (max-width: 560px) {
  .erow { grid-template-columns: 64px 1fr 1fr 32px; }
  .erow .f-nome { grid-column: 2 / -1; }
  .erow .f-ser { grid-column: 1 / 2; }
}

/* evolução */
.prog { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.prow { display: grid; grid-template-columns: 1fr 110px auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .n { font-weight: 600; min-width: 0; }
.prow .v { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1; }
.prow .g { font-size: 12px; color: var(--good); font-family: var(--body); font-weight: 700; }
.prow .g.flat { color: var(--muted); }
.spark { width: 110px; height: 32px; display: block; }
.sess { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.sess:last-child { border-bottom: 0; }
.sess .d { font-variant-numeric: tabular-nums; font-weight: 600; width: 52px; flex: none; }
.sess .t { flex: 1; min-width: 0; }
.sess .t small { color: var(--muted); display: block; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calhead button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; width: 38px; height: 34px; font-size: 18px; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.calgrid .wd { font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.calgrid .d { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 50%; font-size: 14px; position: relative; }
.calgrid .d.on { background: var(--dc, var(--accent)); color: #fff; font-weight: 700; }
.calgrid .d.today { box-shadow: inset 0 0 0 2px var(--ink); }
.callegend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
.callegend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--dc); margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
td small { display: block; font-size: 11px; color: var(--muted); }
td small.up { color: var(--danger); } td small.down { color: var(--good); }

/* modais */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(10,15,20,.55); display: flex; align-items: flex-end; justify-content: center; }
.panel {
  background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 12px;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width: 700px) { .modal { align-items: center; } .panel { border-radius: 18px; max-height: 88%; } }
.panel .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.close { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 14px; font-weight: 700; flex: none; }
.stage { background: var(--stage); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.stage canvas { width: 100%; aspect-ratio: 300 / 220; display: block; }
.steps { margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 8px; }
.tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.musc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.musc i { width: 12px; height: 12px; border-radius: 3px; background: var(--muscle); display: inline-block; }
.video { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; font-weight: 700; color: var(--ink); align-self: flex-start; }
.video::before { content: ""; border-left: 11px solid var(--p4); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.libgroups { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.libgroups .chip { font-size: 13px; padding: 6px 12px; }
.libitem { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.libitem:last-child { border-bottom: 0; }
.libitem .n { font-weight: 700; }
.libitem .g { font-size: 12px; color: var(--muted); }

/* timer + toast */
.timer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 12px;
}
.timer .clock { font-family: var(--display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.timer .lbl { flex: 1; font-size: 13px; opacity: .8; min-width: 0; }
.timer button { border: 1px solid currentColor; background: none; color: inherit; border-radius: 9px; padding: 8px 12px; font-weight: 600; }
.timer .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--good); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 600; z-index: 30; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }

/* modo simples */
body.big { font-size: 19px; }
body.big h2 { font-size: 28px; }
body.big .ex { grid-template-columns: 1fr; padding: 16px; gap: 14px; }
body.big .ex .thumb { width: 100%; height: auto; aspect-ratio: 300 / 200; }
body.big .ex .name { font-size: 24px; }
body.big .ex .meta, body.big .ex .last { font-size: 17px; }
body.big .label { font-size: 13px; }
body.big .field input { font-size: 22px; padding: 12px; }
body.big .inputs { grid-template-columns: 1fr auto; }
body.big .rest-btn { font-size: 18px; padding: 12px 16px; min-height: 56px; }
body.big .howbtn { font-size: 20px; padding: 8px 0; }
body.big .btn { font-size: 20px; padding: 18px; }
body.big .care { font-size: 17px; }
body.big .ficha .obj { font-size: 20px; } body.big .ficha .dates, body.big .ficha .obs { font-size: 16px; }
body.big .state { font-size: 15px; }
body.big .chip { font-size: 17px; padding: 10px 18px; }
body.big .tab { font-size: 17px; padding: 12px 4px; }
body.big .steps { font-size: 19px; gap: 12px; }
body.big .panel h2 { font-size: 30px; }
body.big .close { font-size: 18px; padding: 12px 18px; }
body.big .video { font-size: 18px; padding: 14px 18px; }
body.big .timer .clock { font-size: 48px; }
body.big .timer .lbl { font-size: 17px; }
body.big .timer button { font-size: 18px; padding: 12px 16px; }
body.big .calgrid .d { font-size: 17px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- modo aluno: uma tela por vez, tudo grande ---------- */
:root { --go: #23774A; --go-ink: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --go: #3FA56C; --go-ink: #08130C; } }
:root[data-theme="dark"] { --go: #3FA56C; --go-ink: #08130C; }
#aluno { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: flex; flex-direction: column; gap: 18px; font-size: 20px; line-height: 1.4; }

:root { --display: "Archivo", system-ui, sans-serif; --body: "Archivo", system-ui, sans-serif; }

  --danger: #FF5A4E; --danger-bg: #331614;
  --p1: #FF5C8A; --p2: #FF7A3D; --p3: #B39CFF; --p4: #FFD23D; --p5: #8B939A; --cardio: #3DD6F5;

html.sport.light .a-link, html.sport.light #aluno details summary, html.sport.light .howbtn, html.sport.light .btn.link { color: var(--ink-accent); }
html.sport.light .tabbar .tab[aria-selected="true"] { color: var(--ink-accent); }
html.sport.light .tabbar .tab[aria-selected="true"] svg { background: rgba(200,243,29,.45); }
html.sport.light .calgrid .d.today { box-shadow: inset 0 0 0 2px var(--ink); }
html.sport.light .a-note, html.sport.light .care, html.sport.light .banner { color: var(--ink); }
html.sport.light .spark path[stroke], html.sport.light .chart path[stroke] { stroke: #6E9400; }
html.sport.light #ringArc { stroke: #8DBA00; }
html.sport.light .hero { box-shadow: 0 14px 30px -18px rgba(110,148,0,.6); }
html.sport.light .a-big.soft, html.sport.light .a-plain { background: var(--surface); }
/* modo simples: sem caixa alta nem letra condensada, pra ler fácil */
html.sport #aluno.simples h1, html.sport #aluno.simples h2, html.sport #aluno.simples .a-big { text-transform: none; font-stretch: 100%; letter-spacing: 0; }
html.sport #aluno.simples h1 { font-size: 34px; font-weight: 800; line-height: 1.1; }
html.sport #aluno.simples .a-clock { font-size: 110px; }
/* botão de aparência */
.themebtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; width: 42px; height: 42px; display: grid; place-items: center; flex: none; padding: 0; }
.themebtn svg { width: 22px; height: 22px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1em; }
.seg button svg { width: 20px; height: 20px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.a-headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

/* ---------- séries com carga e reps + observações ---------- */
.setrows { display: flex; flex-direction: column; gap: 8px; }
.sethead, .setrow { display: grid; grid-template-columns: 36px 1fr 1fr 56px; gap: 8px; align-items: center; }
.sethead span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.sethead span:first-child { text-align: center; }
.setrow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px; }
.setrow .sn { text-align: center; font-weight: 800; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.setrow input { width: 100%; min-width: 0; border: 0; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 12px 10px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; font-family: var(--display); font-stretch: 85%; }
.setrow input::placeholder { color: var(--muted); opacity: .55; font-weight: 600; }
.setrow input:focus { outline: 2px solid var(--accent); }
.setok { height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 22px; font-weight: 900; }
.setok[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0B0D0F; }
.setrow.done { border-color: var(--accent); }
.setrow.done .sn { color: var(--ink); }
.obsfield textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 16px; font-family: inherit; }
.obsfield textarea:focus { outline: 2px solid var(--accent); }
.lastobs { font-size: .85em; margin: 6px 0 0; }
details.sess { display: block; padding: 0; }
details.sess > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; }
details.sess > summary::-webkit-details-marker { display: none; }
details.sess[open] > summary { border-bottom: 1px dashed var(--line); }
.sessbody { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 12px 76px; font-size: 13px; }
.sdet { color: var(--muted); font-variant-numeric: tabular-nums; }
.sobs { color: var(--ink); }
@media (max-width: 400px) { .sessbody { padding-left: 14px; } }

/* ---------- semana, cardio e descanso ---------- */
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wkd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; }
.wkd.today { background: var(--surface-2); }
.wl { font-size: 12px; font-weight: 700; color: var(--muted); }
.wc { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; border: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.wkd.done .wc { background: var(--accent); border-color: var(--accent); color: #0B0D0F; }
.wkd.today .wc { border-color: var(--ink); }
.wi { display: flex; gap: 3px; height: 8px; }
.wi i, .wklegend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.it { background: var(--accent); } .ic { background: var(--cardio); } .ir { background: var(--line); }
html:not(.sport) .it { background: var(--accent); }
.wklegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.wklegend span { display: inline-flex; align-items: center; gap: 6px; }
.streak { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: #0B0D0F; }
.cardio-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.cardio-card .cc-ic { width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, var(--cardio) 18%, transparent); color: var(--cardio); display: grid; place-items: center; }
.cardio-card .cc-ic svg { width: 28px; height: 28px; }
.cardio-card .kicker, .rest-card .kicker { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cc-t { font-size: 20px; font-weight: 800; line-height: 1.15; }
.cc-m { font-size: 14px; color: var(--muted); }
.cc-done { font-weight: 800; color: var(--ink-accent, var(--good)); white-space: nowrap; }
.cardio-card.done { opacity: .75; }
html.sport .cc-t { font-family: var(--display); font-stretch: 78%; text-transform: uppercase; font-size: 24px; }
#aluno.simples .cc-t { font-size: 24px; text-transform: none; font-stretch: 100%; }
.rest-card { background: var(--surface); border: 1px dashed var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.calgrid .d.cd::after { content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--cardio); }
.calgrid .d.on.cd::after { background: #0B0D0F; }
.callegend .cdot { background: var(--cardio); }
/* editor da semana */
.semana { gap: 0; padding: 4px 14px; }
.sd { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.sd:last-of-type { border-bottom: 0; }
.sd-h { display: flex; align-items: center; justify-content: space-between; }
.sd-rest { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.sd-it { display: grid; grid-template-columns: auto 1fr auto auto; gap: 6px; align-items: center; }
.sd-it.cardio { grid-template-columns: auto 1fr 64px auto auto; }
.sd-it select, .sd-it input { min-width: 0; width: 100%; border: 0; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 9px 8px; font-size: 15px; font-family: inherit; }
.sd-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 4px 8px; border-radius: 999px; color: #0B0D0F; }
.sd-tag.t { background: var(--accent); } .sd-tag.c { background: var(--cardio); }
.sd-add { display: flex; gap: 14px; }
.sd-models { padding: 12px 0; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
@media (max-width: 420px) { .sd-it.cardio { grid-template-columns: auto 1fr 56px auto; } .sd-it.cardio select { grid-column: 2 / 4; } }

/* ---------- edição de exercícios (celular primeiro) ---------- */
.erow, #admin .erow { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); grid-template-columns: none; }
.er-top { display: grid; grid-template-columns: 34px 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.handle { width: 34px; height: 56px; border: 0; background: var(--surface-2); color: var(--muted); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; touch-action: none; cursor: grab; padding: 0; }
.handle svg { width: 16px; height: 16px; fill: currentColor; }
.er-n { font-size: 12px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
#admin .erow .thumb { width: 56px; height: 44px; border-radius: 10px; }
#admin .erow .thumb .play { width: 16px; height: 16px; right: 3px; bottom: 3px; }
#admin .erow .thumb .play::after { left: 6px; top: 4px; border-left-width: 6px; border-top-width: 4px; border-bottom-width: 4px; }
.er-name { min-width: 0; width: 100%; border: 0; background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 12px 10px; font-size: 16px; font-weight: 700; font-family: inherit; }
.er-name:focus { outline: 2px solid var(--accent); }
.er-move { display: flex; flex-direction: column; gap: 4px; }
.er-move button { width: 34px; height: 26px; border: 0; border-radius: 8px; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; padding: 0; }
.er-move button svg { width: 18px; height: 18px; }
.er-move button:disabled { opacity: .3; }
.er-fields { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 8px; align-items: end; padding-left: 44px; }
.er-fields .field input, .er-fields .field select { font-size: 15px; padding: 9px 8px; }
.er-fields .x { height: 40px; }
.erow .extra { padding-left: 44px; }
.erow.dragging { position: relative; z-index: 3; background: var(--surface-2); box-shadow: 0 10px 30px rgba(0,0,0,.35); border-radius: 14px; outline: 2px solid var(--accent); }
.erow.dragging .handle { cursor: grabbing; background: var(--accent); color: #0B0D0F; }
.erow.dragging .handle .er-n { color: #0B0D0F; }
body.is-dragging { user-select: none; -webkit-user-select: none; }
@keyframes movedFlash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
.erow.moved { animation: movedFlash 1s ease-out; }
@media (prefers-reduced-motion: reduce) { .erow.moved { animation: none; } }
@media (max-width: 380px) { .er-fields { padding-left: 0; } .erow .extra { padding-left: 0; } }

/* ---------- ver outros dias, próximos dias e treinos ---------- */
button.wkd { border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.wkd.sel { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--accent); }
.proxlist { display: flex; flex-direction: column; }
.prox { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.prox:first-child { border-top: 0; }
.prox .pd { display: flex; flex-direction: column; line-height: 1.15; }
.prox .pd small { color: var(--muted); font-size: .8em; font-variant-numeric: tabular-nums; }
.prox .pt { font-size: .92em; min-width: 0; }
.prox .pc { color: var(--muted); font-size: 1.4em; }
.tr-det { border-top: 1px solid var(--line); padding: 10px 0; }
.tr-det:first-of-type { border-top: 0; }
.tr-det > summary { list-style: none; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.tr-det > summary::-webkit-details-marker { display: none; }
.tr-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--pc); color: #0B0D0F; display: grid; place-items: center; font-weight: 900; flex: none; }
.tr-n { display: flex; flex-direction: column; font-weight: 800; }
.tr-n small { font-weight: 500; color: var(--muted); font-size: .8em; }
.tr-det[open] .a-list { margin: 12px 0; }
.plan-card { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--pc); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.plan-card .kicker { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* próximos dias em cartões deslizáveis */
.prox-card { overflow: hidden; }
.prow2 { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 0 6px; scrollbar-width: none; scroll-padding-left: 0; }
.prow2::-webkit-scrollbar { display: none; }
.ptile { flex: 0 0 116px; scroll-snap-align: start; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 16px; padding: 12px; cursor: pointer; font: inherit; min-height: 132px; }
.ptile.rest { background: transparent; border-style: dashed; }
.pdow { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pnum { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 34px; line-height: .9; font-variant-numeric: tabular-nums; }
.ptags { display: flex; flex-direction: column; gap: 5px; width: 100%; margin-top: auto; }
.ptag { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 5px 8px; border-radius: 999px; background: var(--surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptag i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ptag.t i { background: var(--pc); }
.ptag.c i { background: var(--cardio); }
.ptag.r { color: var(--muted); background: transparent; padding-left: 0; }
#aluno.simples .ptile { flex-basis: 132px; min-height: 150px; }
#aluno.simples .pdow { font-size: 13px; }
#aluno.simples .ptag { font-size: 14px; }
/* ---------- telas de configuração ---------- */
.setup { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; display: flex; flex-direction: column; gap: 16px; }
.setup ol { padding-left: 22px; display: flex; flex-direction: column; gap: 8px; margin: 0; }
.linkbox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px; word-break: break-all; user-select: all; }

</style>
</head>
<body>
<div id="loading" class="setup"><p class="sub">Carregando…</p></div>
<div id="setup" class="setup" hidden></div>

<div class="wrap" id="admin" hidden>
  <header class="appbar">
    <div class="hello-box"><div class="hello" id="hello">Olá</div><div class="sub" id="today"></div></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="people" id="people" aria-label="Pessoas"></nav>
  <div id="newPerson" class="sheet" hidden>
    <div class="field"><label class="label" for="np-nome">Nome</label><input id="np-nome" class="txt" placeholder="Ex.: Mãe" maxlength="30"></div>
    <div class="row"><button class="btn" id="np-ok">Adicionar pessoa</button><button class="btn ghost" id="np-cancel">Cancelar</button></div>
  </div>
  <main id="view"></main>
  <nav class="tabbar" role="tablist" id="tabs" aria-label="Seções">
    <button class="tab" role="tab" data-tab="montar" id="tab-montar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Montar</span></button>
    <button class="tab" role="tab" data-tab="hist" id="tab-hist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6.5 15.5l4-4.5 3 2.5 4.5-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="7.5" r="1.6" fill="currentColor"/></svg><span>Evolução</span></button>
  </nav>
</div>

<div id="aluno" hidden></div>

<div class="modal" id="howModal" hidden role="dialog" aria-modal="true" aria-labelledby="howTitle"><div class="panel" id="howPanel"></div></div>
<div class="modal" id="libModal" hidden role="dialog" aria-modal="true" aria-labelledby="libTitle"><div class="panel" id="libPanel"></div></div>

<div class="timer" id="timer" hidden>
  <div class="bar" id="timerBar"></div>
  <div class="clock" id="timerClock">0:00</div>
  <div class="lbl" id="timerLbl">Descanso</div>
  <button id="timerAdd">+15s</button>
  <button id="timerStop">Parar</button>
</div>

<div class="a-rest" id="rest" hidden>
  <p class="a-muted" style="font-size:22px;font-weight:600;margin:0">Descanse um pouco</p>
  <svg class="a-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="7"/><circle id="ringArc" cx="50" cy="50" r="44" fill="none" stroke="var(--go)" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg>
  <div class="a-clock" id="clock">1:30</div>
  <p id="restMsg" style="font-size:20px;margin:0">Respire fundo. Beba um gole de água.</p>
  <button class="a-plain" id="skip" style="max-width:340px">Já descansei</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="fig.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
